[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northshore-property-watchdog"
version = "0.1.0"
description = "North Shore detached freehold property monitoring MVP."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "jinja2>=3.1",
  "Pillow>=10.0",
  "pandas>=2.0",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "shapely>=2.0,<3",
  "tenacity>=8.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.49,<2"]
crawler = [
  "scrapy>=2.11,<3",
  "scrapy-playwright>=0.0.40,<1",
]

[project.scripts]
northshore-watchdog = "northshore_watchdog.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

extends: config/research.yaml

schema_version: research-v1-mls-first

coverage_gaps:
  - Direct MLS primary feed/export is not supplied in this environment; the MLS_PRIMARY slot is intentionally unavailable.
  - REALTOR.ca and Zolo public HTTP feeds are used for bounded listing discovery; exploratory single-source observations are allowed and enter a manual cross-check queue.
  - Direct official enrichment is enabled only for the bounded in-range Stage 2 research/verification queue; municipality-specific portals outside the currently implemented Vancouver routes may still produce NEED_VERIFICATION until an address result is returned.
  - Government tenure/approved-use/permit and sold-comparable data remain separate verification items; Vancouver assessment identity, zoning, road geometry, and VSB catchment are queried when their official endpoints return a deterministic result.


      - moderately busy local road

# Full-portfolio report policy.  This is reporting metadata and does not
# change the existing score engine.  Missing data is surfaced for review, not
# converted into a negative score.
portfolio_report:
  research_as_of: '2026-09-07'
  standard_lot_width_ft: 33
  standard_lot_depth_ft: 122
  standard_lot_area_sqft: 4026
  standard_house_sqft: 1700
  road_discount_mode: USER_APPROVED_PRIOR
  data_completeness_affects_score: false
  unknown_value_policy: SHOW_UNKNOWN
  rule_registry: config/vancouver-zoning-rules-2026-09-07.yaml

# Location Provider V2.1.  This section is an enrichment configuration only;
# it is deliberately not read by the production Current Use/Redevelopment/
# Dual Value ranking until the provider benchmark and stability audits pass.
location_providers:
  enabled: true
  model_name: FAMILY_DETACHED_WALK_SCORE
  model_version: '1.0'
  cache_path: data/research/history/location-provider-snapshots.jsonl
  cache_ttl_days: 180
  output_dir: research/location-provider
  walk_score:
    enabled: true
    api_key_env: WALK_SCORE_API_KEY
    endpoint: https://api.walkscore.com/score

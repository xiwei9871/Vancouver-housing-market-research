      market_bucket: vancouver_west
      geography:
        map_params:
          boundary_id: vancouver-westside
          boundary_registry_path: data/research/boundaries/vancouver-market-boundaries-2026-09-05.json
          Center: 49.255000,-123.185000
          LatitudeMax: 49.29200
          LongitudeMax: -123.08000
          LatitudeMin: 49.20500
          LongitudeMin: -123.26500
          ZoomLevel: 13
      desired_filters:
        status: ACTIVE
        municipality: Vancouver
        property_type: DETACHED_HOUSE
        ownership: FREEHOLD
        minimum_bedrooms: 2
        minimum_bathrooms: 1
        minimum_finished_sqft: 1250
        price_min: 1500000
        price_max: 2000000
    - name: vancouver-east

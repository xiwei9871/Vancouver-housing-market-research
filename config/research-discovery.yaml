extends: research-mls-first.yaml

schema_version: research-discovery-v1

discovery:
  enabled: true
  max_result_cards: 500
  sample_size: 5
  # null means retain every candidate that passes native and post-filter
  # validation; ranking orders them but does not arbitrarily cut the set.
  shortlist_limit: null

  presets:

      - w 41st avenue
      - e 49th avenue
      - w 49th avenue
      - king edward avenue
      - e 12th avenue
      - w 12th avenue
      - broadway
      - hastings street
      - arterial road
      - direct arterial exposure
      - commercial frontage
      - heavy bus route
    collector:

extends: config/research-mls-first.yaml

schema_version: research-v1-real-single-source

coverage_gaps:
  - This profile uses one bounded REALTOR.ca public capture for real-data pipeline testing.
  - Official Stage 2 enrichment is enabled for BC Assessment, municipal zoning, City of Vancouver road geometry, VSB catchment boundaries, and registered-sales history; unresolved municipality-specific endpoints still enter the verification queue.
  - REALTOR.ca status/history remains a dated public-page observation; the current sold price, title tenure, approved use, and permit checks may still require manual follow-up. Road distance is an official street-centerline estimate, not a survey measurement.
  - Values in the capture are observations from public listing pages, not an entitlement or government record.


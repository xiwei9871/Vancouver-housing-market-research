research_policy:
  hard_price_range: true
  allow_out_of_range_special_triggers: false
  primary_asset_classes:
    - DETACHED_HOUSE
  supplementary_asset_classes:
    - DUPLEX
  excluded_asset_classes:
    - STRATA_DUPLEX
    - MULTIPLEX
    - NON_TARGET
  standard_redevelopment_min_lot_area_sqft: 3000
  standard_redevelopment_min_frontage_ft: 33
  standard_redevelopment_min_depth_ft: 100
  house_rebuild_only_buckets:
    - vancouver_west
  exclude_steep_lots: true
  current_house_minimums:
    bedrooms: 2
    bathrooms: 1
    finished_sqft: 1250
  major_road_discount_threshold: 0.15
  major_road_distance_threshold_m: 50

storage:
  sqlite_path: outputs/research_real_single_source.sqlite

reports:
  weekly_dir: reports/weekly-real-single-source
  latest_path: reports/latest-real-single-source.md

acquisition:
  strategy: REAL_DATA_SINGLE_SOURCE_PROVISIONAL
  allow_single_source_provisional: true
  sources:
    - name: realtor-ca-real-capture
      type: LOCAL_JSON
      path: data/research/inputs/realtor_ca_real_capture_2026-09-01.json
      source_type: MLS
      source_role: REALTOR_CA_PUBLIC
      source_registry_id: source:realtor-ca-public
      source_url: https://www.realtor.ca/bc/greater-vancouver/single-family-homes-for-sale
      access_method: manual_web_capture
      authorization_status: NOT_APPLICABLE
      evidence_status: CONFIRMED
      source_version: public-page-visible-capture-2026-09-01
      coverage_complete: false
      enabled: true

enrichment:
  providers: []

comparables:
  sources: []
  source_path: null
  allow_single_source_provisional: true
